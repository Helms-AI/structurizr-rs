[package]
name = "structurizr-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model Context Protocol server for structurizr-rs"

[features]
default = ["stdio"]
stdio = []
websocket = ["tokio-tungstenite"]
http = ["axum", "tower-http", "tokio-stream"]

[dependencies]
# Core dependencies
structurizr-core.workspace = true
structurizr-dsl.workspace = true
structurizr-export.workspace = true
structurizr-render.workspace = true
structurizr-web.workspace = true

# MCP SDK - using rmcp (the official Rust MCP SDK from modelcontextprotocol)
rmcp = { version = "0.12", features = ["server", "transport-io", "macros", "transport-async-rw", "transport-streamable-http-server", "schemars"] }

# Async runtime (already in workspace)
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

# Optional WebSocket support
tokio-tungstenite = { version = "0.24", optional = true }

# Optional Streamable HTTP integration with Axum
axum = { workspace = true, optional = true, features = ["macros"] }
tower-http = { workspace = true, optional = true }
tokio-stream = { version = "0.1", optional = true }

# Additional dependencies
async-trait = "0.1"
uuid = { workspace = true, features = ["v4"] }
# Use schemars 1.x to match rmcp's version
schemars = "1.2"
# Date handling for ADRs
chrono = { version = "0.4", features = ["serde"] }
# Async stream utilities (for WebSocket/HTTP)
futures-util = "0.3"