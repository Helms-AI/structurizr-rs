[package]
name = "structurizr-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web server for Structurizr Lite"

[features]
default = []
mcp-proxy = ["dep:reqwest", "dep:futures-util", "dep:tokio-tungstenite"]

[dependencies]
structurizr-core.workspace = true
structurizr-dsl.workspace = true
structurizr-render.workspace = true
structurizr-export.workspace = true
structurizr-config.workspace = true
structurizr-github.workspace = true
structurizr-analysis.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
notify.workspace = true
tantivy.workspace = true
uuid.workspace = true
secrecy.workspace = true
regex-lite.workspace = true
chrono.workspace = true
comrak.workspace = true

# Optional dependencies for MCP proxy
reqwest = { version = "0.11", optional = true, features = ["json", "stream"] }
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.24", optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile = "3"
