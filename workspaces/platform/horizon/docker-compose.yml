version: '3.9'

# Horizon Platform - Local Development Environment
# ================================================
# This docker-compose provides all infrastructure services needed for local development.
# Services are configured with hot-reload capabilities where applicable.
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f        # Follow logs
#   docker-compose down           # Stop all services
#
# For hot-reload development, use with docker-compose.override.yml

services:
  # ==========================================
  # Database Services
  # ==========================================

  postgres:
    image: postgres:15-alpine
    container_name: horizon-postgres
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: horizon
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - horizon-network

  redis:
    image: redis:7-alpine
    container_name: horizon-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - horizon-network

  # ==========================================
  # Object Storage (S3-Compatible)
  # ==========================================

  minio:
    image: minio/minio:latest
    container_name: horizon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - horizon-network

  # ==========================================
  # Vector Database (AI Embeddings)
  # ==========================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: horizon-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - horizon-network

  # ==========================================
  # Identity Provider (Self-Hosted)
  # ==========================================

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: horizon-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/horizon
      KC_DB_USERNAME: horizon
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - horizon-network

  # ==========================================
  # Message Platform (NATS JetStream)
  # See ADR-018 for details on the migration from Kafka
  # ==========================================

  nats:
    image: nats:2.10-alpine
    container_name: horizon-nats
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./docker/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    ports:
      - "4222:4222"   # NATS client connections
      - "8222:8222"   # HTTP monitoring
      - "9222:9222"   # WebSocket connections
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - horizon-network

  # ==========================================
  # Analytics Database (Time-Series)
  # ==========================================

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: horizon-clickhouse
    environment:
      CLICKHOUSE_DB: horizon
      CLICKHOUSE_USER: horizon
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-devpassword}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "8123:8123"   # HTTP interface
      - "9004:9000"   # Native TCP interface (remapped to avoid MinIO conflict)
      - "9363:9363"   # Prometheus metrics
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - horizon-network

  # ==========================================
  # Search Service
  # ==========================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: horizon-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - horizon-network

  # ==========================================
  # Monitoring Stack
  # ==========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: horizon-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - horizon-network

  grafana:
    image: grafana/grafana:latest
    container_name: horizon-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - horizon-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: horizon-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "4317:4317"
      - "4318:4318"
    networks:
      - horizon-network

# ==========================================
# Networks
# ==========================================

networks:
  horizon-network:
    driver: bridge
    name: horizon-network

# ==========================================
# Volumes
# ==========================================

volumes:
  postgres_data:
    name: horizon-postgres-data
  redis_data:
    name: horizon-redis-data
  minio_data:
    name: horizon-minio-data
  qdrant_data:
    name: horizon-qdrant-data
  nats_data:
    name: horizon-nats-data
  clickhouse_data:
    name: horizon-clickhouse-data
  clickhouse_logs:
    name: horizon-clickhouse-logs
  elasticsearch_data:
    name: horizon-elasticsearch-data
  prometheus_data:
    name: horizon-prometheus-data
  grafana_data:
    name: horizon-grafana-data
