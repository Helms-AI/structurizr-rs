# NATS Server Configuration for Horizon Platform
# See ADR-018 for details on the NATS messaging platform

# Server identification
server_name: horizon-nats

# Client connections
port: 4222

# HTTP monitoring
http_port: 8222

# WebSocket support for browser clients
websocket {
    port: 9222
    no_tls: true
}

# JetStream configuration
jetstream {
    store_dir: /data/jetstream
    max_memory_store: 256MB
    max_file_store: 10GB
}

# Logging
debug: false
trace: false
logtime: true

# Authorization (disabled for local development)
# For production, use token or nkey authentication
# authorization {
#     token: "your-secret-token"
# }
